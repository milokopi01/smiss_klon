<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SMIS-PRO | Sistem Pengurusan Kejohanan Olahraga</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden; /* Mengelakkan scrollbar berganda */
      background-color: #ffffff;
    }
    
    /* Loading screen styles */
    #loading {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      font-family: sans-serif;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #1e3a8a; /* Warna korporat */
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      position: absolute;
      top: 0; left: 0;
      z-index: 1;
    }
  </style>
</head>
<body>
  
  <!-- Skrin Memuatkan (Loading) -->
  <div id="loading">
    <div class="spinner"></div>
    <div style="color: #1e3a8a; font-weight: bold;">Memuatkan Pangkalan Data SMIS...</div>
  </div>

  <!-- Embed (Tanam) Pautan Google Apps Script -->
  <iframe 
    id="gasFrame"
    src="https://script.google.com/macros/s/AKfycbzMgQHLP5jNwNIX_gMhzJJDctiBPlWHGoSjdrIXX5mpMUY2decCQLkNr80-3m62sUR0/exec" 
    allowfullscreen>
  </iframe>

  <script>
    // Hilangkan skrin memuatkan apabila iframe selesai dimuatkan
    document.getElementById('gasFrame').onload = function() {
      document.getElementById('loading').style.display = 'none';
    };

    // Daftar Service Worker untuk keupayaan PWA (Install to Homescreen)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(registration => console.log('ServiceWorker berjaya didaftarkan'))
          .catch(err => console.log('Pendaftaran ServiceWorker gagal: ', err));
      });
    }
  </script>
</body>
</html>
